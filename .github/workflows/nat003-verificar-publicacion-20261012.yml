name: Natura nat003 auditoria publica puntual sitemap
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nat003-verificar-publicacion-20261012.yml"
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Leer web publicada robots sitemap canonical y verificacion
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, xml.etree.ElementTree as ET, re
          base="https://gruemp.github.io/natura/"
          targets=["robots.txt","sitemap.xml","catalogo.html","google8559800fc0ba033d.html"]
          downloaded={}
          for path in targets:
              url=base+path
              req=urllib.request.Request(url,headers={"User-Agent":"NaturaSitemapAudit/1.0 (+read-only)","Accept":"text/html,application/xml,text/plain,*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=r.read(250000)
                      status=r.status
                      final=r.url
                      typ=r.headers.get("Content-Type","")
              except urllib.error.HTTPError as e:
                  print("HTTP",path,e.code,"ERR")
                  raise
              except Exception as e:
                  print("ERROR",path,type(e).__name__)
                  raise
              print("HTTP",path,status,"TYPE",typ,"BYTES",len(data),"FINAL",final)
              if status!=200 or final!=url:raise SystemExit("URL publica no coincide: "+path)
              downloaded[path]=data
          robots=downloaded["robots.txt"].decode("utf-8-sig")
          if not re.search(r"(?im)^\s*User-agent:\s*\*\s*$",robots):raise SystemExit("Falta robots agente general")
          if not re.search(r"(?im)^\s*Allow:\s*/\s*$",robots):raise SystemExit("Falta directiva allow")
          if not re.search(r"(?im)^\s*Sitemap:\s*https://gruemp\.github\.io/natura/sitemap\.xml\s*$",robots):raise SystemExit("Falta declaración Sitemap")
          tree=ET.fromstring(downloaded["sitemap.xml"])
          ns="{http://www.sitemaps.org/schemas/sitemap/0.9}"
          urls=[(e.findtext(ns+"loc"),e.findtext(ns+"lastmod")) for e in tree.findall(ns+"url")]
          print("SITEMAP_ENTRADAS",len(urls),urls)
          if len(urls)!=1 or urls[0][0]!=base+"catalogo.html":raise SystemExit("URL sitemap incorrecta")
          page=downloaded["catalogo.html"].decode("utf-8-sig")
          if 'href="'+base+'catalogo.html"' not in page:raise SystemExit("Canonical no encontrado")
          if 'content="index,follow' not in page:raise SystemExit("Meta robots inesperada")
          if "google-site-verification: google8559800fc0ba033d.html" not in downloaded["google8559800fc0ba033d.html"].decode("utf-8-sig"):
              raise SystemExit("Archivo de verificacion incorrecto")
          print("NAT003_PUBLICO_CORRECTO: HTTP 200 4 rutas, XML, robots, canonical y archivo verificacion")
          if urls[0][1]!="2026-10-12":
              print("ADVERTENCIA_LASTMOD:",urls[0][1],"versus cambios GitHub 2026-10-12")
          print("NO_ACREDITA_INDEXACION_GSC: Search Console requiere propiedad y permiso autenticados")
          PY
