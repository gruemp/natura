name: Auditar paridad Natura GitHub Drive 68 archivos una vez
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nat015-verificar-paridad-una-vez.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar codigo de referencia inmutable
        uses: actions/checkout@v4
        with:
          ref: "7efbde14e2b63061858bb8080d9b0a7059cea3da"
          persist-credentials: false
      - name: Auditar solo metadatos y MD5 de Drive sin escrituras
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.parse,urllib.request,urllib.error
          SNAPSHOT="7efbde14e2b63061858bb8080d9b0a7059cea3da"
          ROOT="14aLaWOZKqHKm42qlZmcx2HXnDwR9c249"
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=SNAPSHOT:raise SystemExit("Git snapshot inesperado")
          auth=json.loads(os.environ["CLASPRC_JSON"])
          c=(auth.get("tokens") or {}).get("default") or auth.get("token") or auth
          client_id=c.get("client_id") or auth.get("client_id") or auth.get("clientId")
          client_secret=c.get("client_secret") or auth.get("client_secret") or auth.get("clientSecret")
          refresh=c.get("refresh_token") or auth.get("refresh_token")
          if not all((client_id,client_secret,refresh)):raise SystemExit("No hay credencial metadata de lectura")
          body=urllib.parse.urlencode({"client_id":client_id,"client_secret":client_secret,"refresh_token":refresh,"grant_type":"refresh_token"}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=body),timeout=30) as r:token=json.load(r)["access_token"]
          except Exception:raise SystemExit("No se pudo consultar metadatos Google")
          def api(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
              except urllib.error.HTTPError as e:raise RuntimeError("Google Drive lectura HTTP "+str(e.code)) from None
          def children(fid):
              out=[];page=None
              while True:
                  q="'"+fid+"' in parents and trashed = false"
                  args={"q":q,"pageSize":"1000","fields":"nextPageToken,files(id,name,mimeType,md5Checksum,size,parents)","supportsAllDrives":"true","includeItemsFromAllDrives":"true"}
                  if page:args["pageToken"]=page
                  result=api("https://www.googleapis.com/drive/v3/files?"+urllib.parse.urlencode(args))
                  out+=result.get("files",[])
                  page=result.get("nextPageToken")
                  if not page:break
              names=[v["name"] for v in out]
              if len(names)!=len(set(names)):raise SystemExit("Hay nombres repetidos en la carpeta destino")
              return {v["name"]:v for v in out}
          root=pathlib.Path.cwd()
          paths=subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          ignore={".png",".webp",".jpg",".jpeg",".gif",".ico",".avif",".zip",".pdf"}
          files={}
          for path in paths:
              if not path or path.startswith(".github/archivo/") or pathlib.Path(path).suffix.lower() in ignore or path.startswith("logo_empresa."):continue
              if path.startswith("apps-script/") or path.startswith(".github/") or "/" not in path:
                  if (root/path).is_file():files[path]=hashlib.md5((root/path).read_bytes()).hexdigest()
          if len(files)!=68:raise SystemExit("Cantidad Git inesperada: "+str(len(files)))
          def walk(folder,prefix=""):
              lookup=children(folder)
              results={}
              for name,obj in lookup.items():
                  path=prefix+name
                  if path.startswith(".github/archivo"):continue
                  if obj["mimeType"]=="application/vnd.google-apps.folder":
                      if path.startswith(("apps-script/",".github/")) or path in ("apps-script",".github"):
                          results.update(walk(obj["id"],path+"/"))
                  else:results[path]=obj
              return results
          drive=walk(ROOT)
          missing=[];different=[];matched=0
          for path,md5 in files.items():
              f=drive.get(path)
              if f is None:missing.append(path)
              elif f.get("md5Checksum")!=md5:different.append(path)
              else:matched+=1
          print("AUDITORIA_NAT015",len(files),"IGUALES",matched,"FALTAN",len(missing),"DIFERENTES",len(different))
          if missing:print("Archivos faltantes",", ".join(missing))
          if different:print("Archivos diferentes",", ".join(different))
          if missing or different:raise SystemExit("La paridad no está comprobada")
          print("NAT015_VERIFICADO_68_DE_68")
          
          PY
