name: Paquete temporal de mejoras de sincronizacion Natura
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paquete-mejora-sync-drive-una-vez.yml"
permissions:
  contents: read
jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "8b2606eab6d500e01299a3e41ae87b66df64869d"
          persist-credentials: false
      - name: Extraer tres archivos modificados
        run: |
          mkdir -p nat015-mejora/apps-script
          mkdir -p nat015-mejora/.github/workflows
          cp README.md nat015-mejora/README.md
          cp apps-script/README.md nat015-mejora/apps-script/README.md
          cp .github/workflows/preparar-cambios-drive-natura.yml nat015-mejora/.github/workflows/preparar-cambios-drive-natura.yml
          test -s nat015-mejora/README.md
          test -s nat015-mejora/apps-script/README.md
          test -s nat015-mejora/.github/workflows/preparar-cambios-drive-natura.yml
      - uses: actions/upload-artifact@v4
        with:
          name: natura-mejora-sync-documentacion
          path: nat015-mejora/
          retention-days: 1
          if-no-files-found: error
