name: Sincronizacion puntual GitHub a Drive Natura 2026-10-12
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sincronizar-drive-natura-una-vez-20261012.yml"
permissions:
  contents: read
concurrency:
  group: natura-drive-solo-una-vez
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar snapshot GitHub verificado
        uses: actions/checkout@v4
        with:
          ref: "7efbde14e2b63061858bb8080d9b0a7059cea3da"
          persist-credentials: false
      - name: Preparar Node y validar fuentes
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Comprobar regresiones de catalogo
        run: |
          node --test catalogo-integracion.test.cjs
          node --check "apps-script/administrar precios natura/admin-contextos.js"
          node --check "apps-script/administrar precios natura/admin-visibilidad.js"
      - name: Conciliar y sincronizar originales, sin eliminaciones
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::No se dispone de autorización"; exit 1; fi
          python3 - <<'PY'
          import hashlib, json, mimetypes, os, pathlib, subprocess, urllib.error, urllib.parse, urllib.request
          from collections import Counter
          
          ROOT_ID="14aLaWOZKqHKm42qlZmcx2HXnDwR9c249"
          SOURCE_COMMIT="7efbde14e2b63061858bb8080d9b0a7059cea3da"
          EXCLUDE_WORKFLOW=".github/workflows/sincronizar-drive-natura-una-vez-20261012.yml"
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=SOURCE_COMMIT:
              raise SystemExit("Fuente GitHub incorrecta; no sincronizar")
          auth=json.loads(os.environ["CLASPRC_JSON"])
          c=((auth.get("tokens") or {}).get("default") or auth.get("token") or auth)
          client_id=c.get("client_id") or auth.get("client_id") or auth.get("clientId")
          client_secret=c.get("client_secret") or auth.get("client_secret") or auth.get("clientSecret")
          refresh=c.get("refresh_token") or auth.get("refresh_token")
          if not all((client_id,client_secret,refresh)):
              raise SystemExit("Credencial sin refresh/client; no sincronizar")
          payload=urllib.parse.urlencode({"client_id":client_id,"client_secret":client_secret,"refresh_token":refresh,"grant_type":"refresh_token"}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request("https://oauth2.googleapis.com/token",data=payload),timeout=45) as r:
                  token=json.load(r)["access_token"]
          except Exception:
              raise SystemExit("No fue posible obtener nueva sesión de Google sin mostrar credenciales")
          del client_id,client_secret,refresh,payload,auth,c
          
          def api(url,method="GET",body=None,typ=None):
              headers={"Authorization":"Bearer "+token}
              if typ:headers["Content-Type"]=typ
              req=urllib.request.Request(url,data=body,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=100) as response:
                      content=response.read()
                      return json.loads(content) if content else {}
              except urllib.error.HTTPError as err:
                  raise RuntimeError("Google Drive rechazó operación "+method+": HTTP "+str(err.code)) from None
              except Exception:
                  raise RuntimeError("Conexión Google Drive falló durante "+method) from None
          
          api("https://www.googleapis.com/drive/v3/files/"+ROOT_ID+"?fields=id,name,mimeType,trashed")
          def list_items(folder):
              items=[]; page=None
              while True:
                  q="'"+folder+"' in parents and trashed = false"
                  params={"q":q,"fields":"nextPageToken,files(id,name,mimeType,md5Checksum,size,parents,trashed)","pageSize":"1000","supportsAllDrives":"true","includeItemsFromAllDrives":"true"}
                  if page:params["pageToken"]=page
                  data=api("https://www.googleapis.com/drive/v3/files?"+urllib.parse.urlencode(params))
                  items+=data.get("files",[])
                  page=data.get("nextPageToken")
                  if not page:break
              names=[x["name"] for x in items]
              if len(names)!=len(set(names)):
                  raise SystemExit("Hay nombres duplicados en una carpeta; detenido para conservar IDs")
              return {x["name"]:x for x in items}
          
          root=pathlib.Path.cwd()
          tracked=subprocess.check_output(["git","ls-files","-z"]).decode("utf-8").split("\0")
          source_files={}
          SKIP_EXT={".png",".webp",".jpg",".jpeg",".gif",".ico",".avif",".zip",".pdf"}
          for p in tracked:
              if not p or p==EXCLUDE_WORKFLOW or p.startswith(".github/archivo/"):continue
              if pathlib.Path(p).suffix.lower() in SKIP_EXT:continue
              if p.startswith("logo_empresa."):continue
              if p.startswith(".github/") or p.startswith("apps-script/") or "/" not in p:
                  f=root/p
                  if f.is_file():source_files[p]=f.read_bytes()
          if not source_files:raise SystemExit("No hay fuentes autorizadas")
          if any(len(b)>4_000_000 for b in source_files.values()):
              raise SystemExit("Fuente excesivamente grande, requiere revisión")
          
          parent_folder={"":ROOT_ID}
          drive_index={"":list_items(ROOT_ID)}
          def add_folders(current,folderid):
              for name,obj in list_items(folderid).items():
                  p=(current+"/"+name).strip("/")
                  if obj["mimeType"]=="application/vnd.google-apps.folder" and not p.startswith(".github/archivo/"):
                      if p.startswith("apps-script/") or p.startswith(".github/") or p in ("apps-script",".github"):
                          parent_folder[p]=obj["id"]
                          drive_index[p]=list_items(obj["id"])
                          add_folders(p,obj["id"])
          for parent in ("apps-script",".github"):
              item=drive_index[""].get(parent)
              if not item or item["mimeType"]!="application/vnd.google-apps.folder":
                  raise SystemExit("Carpeta fuente original no encontrada: "+parent)
              parent_folder[parent]=item["id"]
              drive_index[parent]=list_items(item["id"])
              add_folders(parent,item["id"])
          
          changes=[];new_files=[];folders_needed=set()
          for p,data in sorted(source_files.items()):
              parent,name=p.rsplit("/",1) if "/" in p else ("",p)
              entry=drive_index.get(parent,{}).get(name)
              digest=hashlib.md5(data).hexdigest()
              if entry:
                  if entry["mimeType"]=="application/vnd.google-apps.folder" or entry["mimeType"].startswith("application/vnd.google-apps."):
                      raise SystemExit("Recurso nativo protegido: "+p)
                  if entry.get("md5Checksum")!=digest:
                      changes.append((p,entry["id"],digest,entry["mimeType"],data,parent))
              else:
                  new_files.append((p,digest,data,parent,name))
                  if parent not in parent_folder:folders_needed.add(parent)
          print("PREVIA:",len(source_files),"fuentes Git;",len(changes),"archivos originales por actualizar;",len(new_files),"fuentes nuevas;","demás idénticos:",len(source_files)-len(changes)-len(new_files))
          print("Originales a actualizar:",", ".join(x[0] for x in changes) or "(ninguno)")
          print("Fuentes que faltan en Drive:",", ".join(x[0] for x in new_files) or "(ninguna)")
          # No publicar ni modificar proyectos nativos de Apps Script.
          for folder in sorted(folders_needed,key=lambda p:p.count("/")):
              if not folder.startswith((".github/","apps-script/")):
                  raise SystemExit("Carpeta faltante fuera del alcance: "+folder)
              cur=""
              for component in folder.split("/"):
                  cur=(cur+"/"+component).strip("/")
                  if cur in parent_folder:continue
                  parent=cur.rsplit("/",1)[0] if "/" in cur else ""
                  if parent not in parent_folder:raise SystemExit("Padre faltante de "+cur)
                  content=json.dumps({"name":component,"mimeType":"application/vnd.google-apps.folder","parents":[parent_folder[parent]]}).encode()
                  result=api("https://www.googleapis.com/drive/v3/files?fields=id,name,mimeType,parents",method="POST",body=content,typ="application/json")
                  if result.get("name")!=component or result.get("mimeType")!="application/vnd.google-apps.folder" or result.get("parents")!=[parent_folder[parent]]:
                      raise SystemExit("Carpeta no verificada "+cur)
                  parent_folder[cur]=result["id"]
                  print("CREADA CARPETA",cur)
          
          done=[]
          for p,fid,digest,typ,data,parent in changes:
              url="https://www.googleapis.com/upload/drive/v3/files/"+urllib.parse.quote(fid,safe="")+"?uploadType=media&fields=id,md5Checksum,size,parents"
              result=api(url,method="PATCH",body=data,typ=typ)
              if result.get("id")!=fid or result.get("md5Checksum")!=digest or parent_folder[parent] not in result.get("parents",[]):
                  raise SystemExit("Actualización no verificada: "+p)
              done.append((p,fid))
              print("ACTUALIZADO",p,"ID",fid,"bytes",len(data))
          created=[]
          for p,digest,data,parent,name in new_files:
              if parent not in parent_folder:raise SystemExit("Carpeta no disponible: "+parent)
              boundary="natura-sync-once-20261012"
              typ=mimetypes.guess_type(name)[0] or "application/octet-stream"
              metadata=json.dumps({"name":name,"parents":[parent_folder[parent]]},ensure_ascii=False).encode()
              body=(("--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n").encode()+metadata+
                    ("\r\n--"+boundary+"\r\nContent-Type: "+typ+"\r\n\r\n").encode()+data+
                    ("\r\n--"+boundary+"--\r\n").encode())
              url="https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,md5Checksum,size,parents,mimeType"
              result=api(url,method="POST",body=body,typ="multipart/related; boundary="+boundary)
              if result.get("name")!=name or result.get("md5Checksum")!=digest or parent_folder[parent] not in result.get("parents",[]):
                  raise SystemExit("Nuevo archivo no verificado: "+p)
              created.append((p,result["id"]))
              print("CREADO",p,"ID",result["id"],"bytes",len(data))
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a",encoding="utf-8") as f:
                  f.write("## Sincronización GitHub → originales de Drive\n")
                  f.write("Commit de origen: "+SOURCE_COMMIT+"\n\n")
                  f.write(f"Fuentes comparadas: {len(source_files)}. Originales actualizados: {len(done)}. Fuentes nuevas: {len(created)}. Ya idénticos: {len(source_files)-len(done)-len(created)}.\n")
                  f.write("No se borraron archivos ni se alteraron los proyectos nativos de Apps Script.\n")
          print("SINCRONIZACION_VERIFICADA",len(source_files),len(done),len(created))
          PY
