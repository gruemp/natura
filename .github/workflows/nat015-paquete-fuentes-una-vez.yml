name: Paquete temporal de fuentes Natura nat-015
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nat015-paquete-fuentes-una-vez.yml"
permissions:
  contents: read
jobs:
  empaquetar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "7efbde14e2b63061858bb8080d9b0a7059cea3da"
          persist-credentials: false
      - name: Copiar 12 fuentes exactas sin ejecutarlas
        run: |
          python3 - <<'PY'
          import pathlib,shutil,subprocess
          base=pathlib.Path.cwd()
          files=["README.md","apps-script/README.md","apps-script/administrar precios natura/admin-contextos.js","apps-script/lectura de carpetas en natura/productos-lectura.js","apps-script/pedidos natura/pedidos-tablas.js","catalogo-app.js","catalogo-carrito-pedido.js","catalogo-integracion.test.cjs","catalogo.css","catalogo.html","precios-admin.js","recursos-visuales.js"]
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!='7efbde14e2b63061858bb8080d9b0a7059cea3da':
              raise SystemExit('Snapshot inesperado')
          for name in files:
              source=base/name
              if not source.is_file():raise SystemExit('Falta fuente '+name)
              target=base/'nat015-transfer'/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source,target)
          print('Archivadas',len(files),'fuentes del commit validado')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nat015-fuentes-7efbde14
          path: nat015-transfer/
          if-no-files-found: error
          retention-days: 1
