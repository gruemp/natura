name: Publicar lector publico aislado Natura
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps-script/lector publico natura/**"
      - ".github/workflows/publicar-lector-publico-natura.yml"

permissions:
  contents: read

concurrency:
  group: publicar-apps-script-natura-automaticamente
  cancel-in-progress: false

jobs:
  lector:
    if: ${{ vars.NATURA_PUBLICACION_HABILITADA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Bloquear una publicación que sobrescriba el proyecto administrativo
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("apps-script")
          def script_id(name):
              with (base / name / ".clasp.json").open(encoding="utf-8") as fh:
                  return json.load(fh).get("scriptId")
          lector_id = script_id("lector publico natura")
          admin_id = script_id("administrar precios natura")
          if not lector_id or not admin_id:
              print("::error::Faltan los identificadores de Apps Script")
              raise SystemExit(1)
          if lector_id == admin_id:
              print("::error::Publicación bloqueada: lector y administrador apuntan al mismo proyecto Apps Script; requiere separar o validar un método seguro sin sobrescritura temporal")
              raise SystemExit(1)
          print("Los proyectos son distintos; continúa la verificación existente")
          PY
      - name: Restaurar autorizacion
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"
      - name: Comprobar codigo y despliegue independiente
        run: |
          node --check "apps-script/lector publico natura/Lector.js"
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          reader = Path('apps-script/lector publico natura')
          conf = json.loads((reader / '.clasp.json').read_text())
          assert conf['scriptId'] == '1osm-0ZxL2p5UV041ufVSM2nQZezp2TonkC48wNWIG8EOPWAYMTSVY7DX'
          manifest = json.loads((reader / 'appsscript.json').read_text())
          assert manifest['webapp'] == {'executeAs': 'USER_DEPLOYING', 'access': 'ANYONE_ANONYMOUS'}
          assert manifest['oauthScopes'] == []
          assert manifest['dependencies']['libraries'][0]['version'] == '35'
          deployment = json.loads((reader / 'deployment.json').read_text())
          if not deployment.get('deploymentId'):
              raise SystemExit('Falta autorizar y registrar el despliegue independiente inicial')
          assert deployment['deploymentId'] not in ['AKfycbzotfE1aifLWmjJjyQRTXZo2C9intQnhGZA57n27MCqDDB_BnuhkxhDvDmeuUlK9v09', 'AKfycbwAUk8ysr-3k_T5iRxFpbp8KxmvPpYeGRNbL156lp9CsVjNFjQQgg5v7ySaxO7dcP_X']
          PY_CHECK
      - name: Publicar exclusivamente el lector independiente
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/apps-script/lector publico natura"
          deployment_id="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).deploymentId' "$source_dir/deployment.json")"
          # El original de Google se llama Código.gs; conservar su nombre y sus archivos.
          publish_dir="$(mktemp -d "$RUNNER_TEMP/natura-lector.XXXXXX")"
          cp "$source_dir/.clasp.json" "$publish_dir/.clasp.json"
          cp "$source_dir/appsscript.json" "$publish_dir/appsscript.json"
          cp "$source_dir/Lector.js" "$publish_dir/Código.js"
          cd "$publish_dir"
          clasp push --force
          clasp deploy --deploymentId "$deployment_id" --description "Lector independiente de solo lectura ${GITHUB_SHA}"
          echo "Lector independiente publicado; no se modificó el administrador." >> "$GITHUB_STEP_SUMMARY"
