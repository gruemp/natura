name: Actualizar directorio estático de productos

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - generar-directorio-productos.py
      - directorio-productos.plantilla.html
      - .github/workflows/actualizar-directorio-productos.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-directorio-productos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Leer fuentes públicas y generar HTML completo
        run: python generar-directorio-productos.py
      - name: Comprobar contenido estático y enlaces
        run: node --test directorio-productos.test.cjs
      - name: Publicar solo si cambian los productos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- productos_natura_y_avon_en_santa_marta.html sitemap.xml; then
            echo "El directorio está actualizado."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add productos_natura_y_avon_en_santa_marta.html sitemap.xml
          git commit -m 'Actualizar productos del directorio desde la fuente pública'
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
